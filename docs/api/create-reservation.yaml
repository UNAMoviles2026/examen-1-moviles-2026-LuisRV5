info:
  title: Create Reservation
paths:
  /api/reservations:
    post:
      summary: Create a reservation
      description: Creates a reservation for a coworking space for a specific date and time range
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: Reservation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
components:
  schemas:
    CreateReservationRequest:
      type: object
      required:
        - spaceId
        - date
        - startTime
        - endTime
      properties:
        spaceId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
    ReservationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        spaceId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
        status:
          type: string